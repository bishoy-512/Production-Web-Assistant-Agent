name: web-assistant-agent
services:
  postgres-db:
    image: pgvector/pgvector:pg18
    env_file:
      - .env.postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres-data: