[project]
name = "Production-Grade-AI-Agentic-System"
version = "0.1.0"
description = "A production grade AI agentic system."
authors = [
    { name="Bishoy Amgad", email="bishoy.amgad71@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
keywords = ["chatbot", "ai agentic system"]
dependencies = [
    "asyncpg>=0.32.0",
    "colorama>=0.4.6",
    "concurrent-log-handler>=0.9.31",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
]

[project.urls]
Repository = "https://github.com/bishoy-512/Production-Web-Assistant-Agent.git"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
